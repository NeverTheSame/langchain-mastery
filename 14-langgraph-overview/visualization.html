<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LangGraph — Loop vs Graph</title>
<style>
  :root{--bg:#030710;--panel:#0c1426;--panel2:#111c33;--ink:#e8eefc;--muted:#8da2c9;
    --line:#1e2c4a;--blue:#006DDD;--sky:#7FC8FF;--green:#36d399;--violet:#a78bfa;--amber:#fbbf24;--radius:14px;--shadow:0 10px 30px rgba(0,0,0,.45)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#0a1730,transparent),var(--bg);
    color:var(--ink);font-family:'Inter',system-ui,Segoe UI,Roboto,sans-serif;line-height:1.5;padding:32px 18px 60px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  .toggle{display:flex;gap:8px;margin-bottom:16px}
  button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 14px;font-size:13px;cursor:pointer}
  button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .mapbox{background:#06101f;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
  svg{width:100%;height:auto;display:block}
  .caption{font-size:13px;color:var(--muted);margin-top:14px;min-height:48px}
  .unlocks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{font-size:11.5px;border:1px solid var(--line);border-radius:20px;padding:5px 11px;background:var(--panel)}
  .chip.on{border-color:var(--green);color:var(--green)}
  text{font-family:'Inter',sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <h1>What Modeling Your App as a Graph Unlocks</h1>
  <p class="sub">A plain loop handles the happy path. A real graph adds branching, a human pause, and a checkpoint after every step — production capabilities that come almost for free.</p>
  <div class="toggle">
    <button class="on" id="b-loop">Simple loop</button>
    <button id="b-graph">Real LangGraph graph</button>
  </div>
  <div class="mapbox"><svg viewBox="0 0 560 300" id="svg"></svg></div>
  <div class="caption" id="cap"></div>
  <div class="unlocks" id="chips"></div>
</div>
<script>
  function node(x,y,w,label,color,dashed){
    return '<rect x="'+x+'" y="'+y+'" rx="11" width="'+w+'" height="46" fill="#0c1426" stroke="'+(color||'#1e2c4a')+'"'+(dashed?' stroke-dasharray="5 4"':'')+' stroke-width="1.5"/>'+
      '<text x="'+(x+w/2)+'" y="'+(y+28)+'" fill="#e8eefc" font-size="13" text-anchor="middle">'+label+'</text>';
  }
  function arrow(x1,y1,x2,y2,color,label){
    let s='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(color||'#006DDD')+'" stroke-width="2" marker-end="url(#a)"/>';
    if(label)s+='<text x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2-6)+'" fill="#8da2c9" font-size="11" text-anchor="middle">'+label+'</text>';
    return s;
  }
  const defs='<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#006DDD"/></marker></defs>';
  const loopSVG=defs+
    node(40,130,90,'START','#36d399')+
    node(200,130,110,'LLM node','#7FC8FF')+
    node(420,130,100,'END','#a78bfa')+
    arrow(130,153,200,153)+
    arrow(310,153,420,153)+
    // loop back
    '<path d="M255,130 C255,80 255,80 255,80 L255,80" fill="none"/>'+
    arrow(255,130,255,80,'#006DDD')+arrow(255,80,255,80)+
    '<path d="M255,80 C255,60 280,60 280,80" fill="none" stroke="#006DDD" stroke-width="2"/>'+
    '<text x="300" y="70" fill="#8da2c9" font-size="11">↺ tool loop</text>';
  const graphSVG=defs+
    node(30,130,80,'START','#36d399')+
    node(150,130,100,'LLM node','#7FC8FF')+
    node(150,40,100,'tools','#fbbf24')+
    node(310,40,120,'human pause','#a78bfa',true)+
    node(310,200,120,'fact-check','#7FC8FF')+
    node(470,130,70,'END','#a78bfa')+
    arrow(110,153,150,153)+
    arrow(200,130,200,86,'#006DDD','act')+
    arrow(200,86,200,86)+
    arrow(250,63,310,63,'#a78bfa','approve?')+
    arrow(250,153,310,200,'#006DDD','answer')+
    arrow(430,200,470,153,'#006DDD','pass')+
    arrow(370,86,250,140,'#f87171','reject ↺')+
    // checkpoint markers
    '<circle cx="150" cy="130" r="5" fill="#36d399"/>'+
    '<circle cx="310" cy="40" r="5" fill="#36d399"/>'+
    '<circle cx="310" cy="200" r="5" fill="#36d399"/>'+
    '<text x="30" y="285" fill="#36d399" font-size="11">● = checkpoint saved after each node (resume after a crash)</text>';
  const svg=document.getElementById('svg'),cap=document.getElementById('cap'),chips=document.getElementById('chips');
  const allChips=['conditional branching','human-in-the-loop pause/resume','durable checkpoints','time-travel debug','streaming','multi-agent'];
  function render(mode){
    if(mode==='loop'){
      svg.innerHTML=loopSVG;
      cap.textContent='A simple loop: START → LLM → (loop on tool calls) → END. Fine for the happy path, but there is no branching, no place to pause for a human, and nothing is saved if it crashes.';
      chips.innerHTML=allChips.map(c=>'<span class="chip">'+c+'</span>').join('');
    }else{
      svg.innerHTML=graphSVG;
      cap.textContent='A real graph: the LLM can branch to tools, a human-pause node gates risky actions, a fact-check node can reject and loop back, and a checkpoint is saved after every node so the run survives a restart.';
      chips.innerHTML=allChips.map(c=>'<span class="chip on">✓ '+c+'</span>').join('');
    }
  }
  document.getElementById('b-loop').onclick=e=>{toggle(e);render('loop');};
  document.getElementById('b-graph').onclick=e=>{toggle(e);render('graph');};
  function toggle(e){document.querySelectorAll('.toggle button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');}
  render('loop');
</script>
</body>
</html>
