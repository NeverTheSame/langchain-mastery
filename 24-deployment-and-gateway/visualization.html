<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deployment & LLM Gateway</title>
<style>
  :root{--bg:#030710;--panel:#0c1426;--panel2:#111c33;--ink:#e8eefc;--muted:#8da2c9;
    --line:#1e2c4a;--blue:#006DDD;--sky:#7FC8FF;--green:#36d399;--violet:#a78bfa;--amber:#fbbf24;--red:#f87171;--radius:14px;--shadow:0 10px 30px rgba(0,0,0,.45)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#0a1730,transparent),var(--bg);
    color:var(--ink);font-family:'Inter',system-ui,Segoe UI,Roboto,sans-serif;line-height:1.5;padding:32px 18px 60px}
  .wrap{max-width:880px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 16px;font-size:14px}
  .toggle{display:flex;gap:8px;margin-bottom:14px}
  button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 14px;font-size:13px;cursor:pointer}
  button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .run{background:var(--green);color:#04130c;font-weight:600}
  .mapbox{background:#06101f;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
  svg{width:100%;height:auto;display:block}
  .log{background:#06101f;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;font-family:ui-monospace,monospace;font-size:12px;min-height:96px}
  .log div{padding:2px 0;opacity:0;animation:fin .3s forwards}
  @keyframes fin{to{opacity:1}}
  .ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.info{color:var(--sky)}
  .controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Production Architecture</h1>
  <p class="sub">Follow a request from the app → through the <b>LLM Gateway</b> (budgets, redaction, keys) → into a scaled <b>LangGraph deployment</b> with durable state → and back. Toggle governance off to see what sprawls.</p>
  <div class="toggle">
    <button class="on" id="g-on">Gateway: ON</button>
    <button id="g-off">Gateway: OFF</button>
  </div>
  <div class="mapbox"><svg viewBox="0 0 600 240" id="svg"></svg></div>
  <div class="controls"><button class="run" id="run">▶ Send request</button></div>
  <div class="log" id="log"><span style="color:var(--muted)">Press “Send request”.</span></div>
</div>
<script>
  const NS='http://www.w3.org/2000/svg';
  let gw=true;
  function svgMarkup(active){
    function box(x,y,w,h,label,sub,color,lit){
      return '<rect x="'+x+'" y="'+y+'" rx="11" width="'+w+'" height="'+h+'" fill="'+(lit?'#0e2018':'#0c1426')+'" stroke="'+(lit?'#36d399':color)+'" stroke-width="'+(lit?'3':'1.6')+'"/>'+
        '<text x="'+(x+w/2)+'" y="'+(y+h/2-3)+'" fill="#e8eefc" font-size="12.5" text-anchor="middle" font-weight="600">'+label+'</text>'+
        (sub?'<text x="'+(x+w/2)+'" y="'+(y+h/2+14)+'" fill="#8da2c9" font-size="10" text-anchor="middle">'+sub+'</text>':'');
    }
    function arr(x1,y1,x2,y2,col){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(col||'#33507e')+'" stroke-width="2" marker-end="url(#m)"/>';}
    let s='<defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#33507e"/></marker></defs>';
    s+=box(20,90,90,56,'App','user request','#8da2c9',active==='app');
    if(gw){
      s+=box(150,80,120,76,'LLM Gateway','budget·redact·keys','#fbbf24',active==='gw');
      s+=arr(110,118,150,118);
      s+=box(310,80,140,76,'LangGraph deploy','queue·scale·stream','#7FC8FF',active==='dep');
      s+=arr(270,118,310,118);
      s+=box(490,40,90,56,'Providers','OpenAI…','#a78bfa',active==='prov');
      s+=box(490,150,90,56,'Postgres','durable state','#36d399',active==='db');
      s+=arr(450,100,490,72);s+=arr(450,140,490,170);
    }else{
      s+=box(310,80,140,76,'LangGraph deploy','queue·scale·stream','#7FC8FF',active==='dep');
      // direct scattered arrows from app to providers
      s+=arr(110,110,310,110,'#f87171');
      s+=box(490,40,90,56,'Providers','keys everywhere','#f87171',active==='prov');
      s+=box(490,150,90,56,'Postgres','durable state','#36d399',active==='db');
      s+=arr(450,100,490,72);s+=arr(450,140,490,170);
      s+='<text x="200" y="100" fill="#f87171" font-size="10">raw keys, no caps</text>';
    }
    return s;
  }
  const svg=document.getElementById('svg'),log=document.getElementById('log');
  function draw(active){svg.innerHTML=svgMarkup(active);}
  function run(){
    log.innerHTML='';const steps=gw?[
      ['app','info','→ App sends "summarize ticket" request'],
      ['gw','warn','→ Gateway: check team budget … 62% of cap, OK'],
      ['gw','warn','→ Gateway: redact PII (email, card) from prompt'],
      ['gw','ok','→ Gateway: inject managed provider key (app never sees it)'],
      ['dep','info','→ Deployment: enqueue run, load thread state from Postgres'],
      ['prov','info','→ Provider call (streamed back through gateway)'],
      ['db','ok','→ Checkpoint saved · response streamed to user ✓']
    ]:[
      ['app','bad','→ App holds a RAW provider key (copy-pasted in repo)'],
      ['prov','bad','→ Direct call: no budget cap — a bug could run up $$$'],
      ['prov','bad','→ PII sent unredacted to the provider (compliance risk)'],
      ['dep','info','→ Deployment still scales & persists state…'],
      ['db','ok','→ …but spend & keys are ungoverned and sprawling']
    ];
    let i=0;(function tick(){if(i>=steps.length){draw();return;}const[node,cls,txt]=steps[i];draw(node);const d=document.createElement('div');d.className=cls;d.textContent=txt;log.appendChild(d);i++;setTimeout(tick,720);})();
  }
  document.getElementById('g-on').onclick=()=>{gw=true;sw('g-on');draw();log.innerHTML='<span style="color:var(--muted)">Gateway ON — press Send request.</span>';};
  document.getElementById('g-off').onclick=()=>{gw=false;sw('g-off');draw();log.innerHTML='<span style="color:var(--muted)">Gateway OFF — press Send request to see the sprawl.</span>';};
  function sw(id){['g-on','g-off'].forEach(b=>document.getElementById(b).classList.remove('on'));document.getElementById(id).classList.add('on');}
  document.getElementById('run').onclick=run;
  draw();
</script>
</body>
</html>
