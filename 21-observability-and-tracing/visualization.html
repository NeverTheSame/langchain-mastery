<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace Explorer</title>
<style>
  :root{--bg:#030710;--panel:#0c1426;--panel2:#111c33;--ink:#e8eefc;--muted:#8da2c9;
    --line:#1e2c4a;--blue:#006DDD;--sky:#7FC8FF;--green:#36d399;--violet:#a78bfa;--amber:#fbbf24;--red:#f87171;--radius:14px;--shadow:0 10px 30px rgba(0,0,0,.45)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#0a1730,transparent),var(--bg);
    color:var(--ink);font-family:'Inter',system-ui,Segoe UI,Roboto,sans-serif;line-height:1.5;padding:32px 18px 60px}
  .wrap{max-width:880px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 16px;font-size:14px}
  .toggle{display:flex;gap:8px;margin-bottom:14px}
  button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 13px;font-size:13px;cursor:pointer}
  button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .cols{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
  @media(max-width:720px){.cols{grid-template-columns:1fr}}
  .tree{background:#06101f;border:1px solid var(--line);border-radius:12px;padding:10px}
  .run{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-radius:8px;margin:4px 0;cursor:pointer;border:1px solid transparent;transition:.15s;font-size:13px}
  .run:hover{background:var(--panel2)}
  .run.sel{border-color:var(--sky);background:var(--panel2)}
  .run.err{color:var(--red)}
  .kind{font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:5px;margin-right:8px}
  .k-chain{background:#1d2a4a;color:#9ec0ff}.k-llm{background:#102a4d;color:var(--sky)}.k-tool{background:#1f1a0d;color:var(--amber)}.k-retr{background:#161228;color:var(--violet)}
  .lat{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)}
  .indent1{margin-left:18px}.indent2{margin-left:36px}
  .detail{background:#06101f;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12.5px;min-height:230px}
  .detail h3{margin:0 0 8px;font-size:14px}
  .row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0;color:var(--muted)}
  .row b{color:var(--ink)}
  .io{font-family:ui-monospace,monospace;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px;margin:6px 0;white-space:pre-wrap;color:#cbd9f3;font-size:11.5px}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px}
  .ok{background:#0e2018;color:var(--green)}.fail{background:#241313;color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Trace Explorer</h1>
  <p class="sub">A trace is a tree of runs. Click any step to inspect its real inputs, outputs, latency and tokens. Toggle to a <b>failing</b> run and find where it broke.</p>
  <div class="toggle"><button class="on" id="t-ok">Healthy run</button><button id="t-bad">Failing run</button></div>
  <div class="cols">
    <div class="tree" id="tree"></div>
    <div class="detail" id="detail"><span style="color:var(--muted)">Select a run on the left.</span></div>
  </div>
</div>
<script>
  const traces={
    ok:[
      {id:0,k:'chain',ind:0,name:'Agent: "Weather in Paris?"',lat:'1.84s',tok:'312',err:false,in:'user: "What\'s the weather in Paris?"',out:'"It\'s 18°C and partly cloudy in Paris."'},
      {id:1,k:'llm',ind:1,name:'ChatModel call #1',lat:'0.71s',tok:'120',err:false,in:'[System, Human] + 2 tools bound',out:'tool_calls: get_weather(city="Paris")'},
      {id:2,k:'tool',ind:1,name:'get_weather(city="Paris")',lat:'0.22s',tok:'—',err:false,in:'{"city":"Paris"}',out:'"18°C, partly cloudy"'},
      {id:3,k:'llm',ind:1,name:'ChatModel call #2',lat:'0.83s',tok:'192',err:false,in:'[…, ToolMessage "18°C…"]',out:'"It\'s 18°C and partly cloudy in Paris."'}
    ],
    bad:[
      {id:0,k:'chain',ind:0,name:'Agent: "Weather in Pariss?"',lat:'2.10s',tok:'280',err:true,in:'user: "weather in Pariss?" (typo)',out:'⚠️ "I\'m not sure where that is."'},
      {id:1,k:'llm',ind:1,name:'ChatModel call #1',lat:'0.68s',tok:'118',err:false,in:'[System, Human]',out:'tool_calls: get_weather(city="Pariss")'},
      {id:2,k:'tool',ind:1,name:'get_weather(city="Pariss")',lat:'0.19s',tok:'—',err:true,in:'{"city":"Pariss"}',out:'❌ Error: city not found → empty result'},
      {id:3,k:'llm',ind:1,name:'ChatModel call #2',lat:'0.74s',tok:'162',err:false,in:'[…, ToolMessage "city not found"]',out:'"I\'m not sure where that is." (gave up)'}
    ]
  };
  let cur='ok';
  const treeBox=document.getElementById('tree'),detail=document.getElementById('detail');
  function renderTree(){
    treeBox.innerHTML=traces[cur].map(r=>
      '<div class="run indent'+r.ind+(r.err?' err':'')+'" data-id="'+r.id+'"><span><span class="kind k-'+r.k+'">'+r.k+'</span>'+(r.err?'⚠️ ':'')+r.name+'</span><span class="lat">'+r.lat+'</span></div>'
    ).join('');
    treeBox.querySelectorAll('.run').forEach(el=>el.onclick=()=>select(+el.dataset.id));
    select(0);
  }
  function select(id){
    treeBox.querySelectorAll('.run').forEach(el=>el.classList.toggle('sel',+el.dataset.id===id));
    const r=traces[cur][id];
    detail.innerHTML='<h3>'+r.name+' <span class="badge '+(r.err?'fail':'ok')+'">'+(r.err?'error':'ok')+'</span></h3>'+
      '<div class="row">kind <b>'+r.k+'</b></div>'+
      '<div class="row">latency <b>'+r.lat+'</b></div>'+
      '<div class="row">tokens <b>'+r.tok+'</b></div>'+
      '<div style="margin-top:8px;color:var(--muted)">input</div><div class="io">'+r.in+'</div>'+
      '<div style="color:var(--muted)">output</div><div class="io">'+r.out+'</div>'+
      (r.err&&r.k==='tool'?'<div style="color:var(--red);margin-top:6px">🔎 Root cause found: the model passed a misspelled city ("Pariss") so the tool returned empty — not a model-reasoning bug, an input bug.</div>':'');
  }
  document.getElementById('t-ok').onclick=()=>{cur='ok';sw('t-ok');renderTree();};
  document.getElementById('t-bad').onclick=()=>{cur='bad';sw('t-bad');renderTree();};
  function sw(id){['t-ok','t-bad'].forEach(b=>document.getElementById(b).classList.remove('on'));document.getElementById(id).classList.add('on');}
  renderTree();
</script>
</body>
</html>
