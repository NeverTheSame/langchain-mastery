<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — The Tool-Calling Round-Trip</title>
<style>
  :root{--bg:#030710;--panel:#0c1426;--panel2:#111c33;--ink:#e8eefc;--muted:#8da2c9;
    --line:#1e2c4a;--blue:#006DDD;--sky:#7FC8FF;--green:#36d399;--violet:#a78bfa;--amber:#fbbf24;--radius:14px;--shadow:0 10px 30px rgba(0,0,0,.45)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#0a1730,transparent),var(--bg);
    color:var(--ink);font-family:'Inter',system-ui,Segoe UI,Roboto,sans-serif;line-height:1.5;padding:32px 18px 60px}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 22px;font-size:14px}
  .controls{display:flex;gap:10px;margin-bottom:18px}
  button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer;font-weight:600}
  button.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .thread{display:flex;flex-direction:column;gap:10px;min-height:340px}
  .m{border:1px solid var(--line);border-radius:12px;padding:12px 14px;opacity:0;transform:translateY(8px);transition:.35s}
  .m.show{opacity:1;transform:none}
  .m .r{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:5px}
  .m .b{font-size:13.5px}
  .sys{background:#161228;border-color:#3a2d5c}.sys .r{color:var(--violet)}
  .hum{background:#0c1426}.hum .r{color:var(--sky)}
  .ai{background:#0d2547}.ai .r{color:#9ecbff}
  .tool{background:#0e2018;border-color:#244a37}.tool .r{color:var(--green)}
  .pill{display:inline-block;font-size:11px;background:#102a4d;border:1px solid #1d63b8;color:#bcd9ff;
    border-radius:20px;padding:2px 9px;margin-top:6px;font-family:ui-monospace,monospace}
  .note{font-size:12px;color:var(--muted);margin-top:10px;min-height:32px}
  .step{font-size:12px;color:var(--muted);margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>The Tool-Calling Round-Trip</h1>
  <p class="sub">An agent is just a message list that grows. Step through it and watch how a tool request and its result are stitched together by <code>tool_call_id</code>.</p>
  <div class="step" id="step">Step 0 / 5</div>
  <div class="controls">
    <button id="next">Next message ▸</button>
    <button class="ghost" id="reset">Reset</button>
  </div>
  <div class="thread" id="thread"></div>
  <div class="note" id="note">Press “Next message” to begin building the conversation.</div>
</div>

<script>
  const steps=[
    {cls:"sys",r:"SystemMessage",b:"You are a weather assistant. Use tools when needed.",note:"The system message sets the rules for the whole conversation."},
    {cls:"hum",r:"HumanMessage",b:"What's the weather in Paris right now?",note:"The user asks something the model can't answer from memory."},
    {cls:"ai",r:"AIMessage",b:"(no text yet — the model decides to call a tool)",pill:'tool_calls: get_weather(city="Paris")  id=call_1',note:"Instead of answering, the model RETURNS a tool call. .content is empty; .tool_calls is populated."},
    {cls:"tool",r:"ToolMessage",b:"18°C, partly cloudy",pill:"tool_call_id = call_1",note:"Your code runs the tool and appends the result, linked back via the SAME id (call_1)."},
    {cls:"ai",r:"AIMessage",b:"It's currently 18°C and partly cloudy in Paris.",note:"With the tool result now in the list, the model produces its final answer. Loop complete."}
  ];
  let i=0;
  const thread=document.getElementById('thread'),note=document.getElementById('note'),stepEl=document.getElementById('step');
  const next=document.getElementById('next'),reset=document.getElementById('reset');
  function add(){
    if(i>=steps.length)return;
    const s=steps[i];
    const d=document.createElement('div');d.className='m '+s.cls;
    d.innerHTML='<div class="r">'+s.r+'</div><div class="b">'+s.b+'</div>'+(s.pill?'<div class="pill">'+s.pill+'</div>':'');
    thread.appendChild(d);requestAnimationFrame(()=>d.classList.add('show'));
    note.textContent=s.note;i++;stepEl.textContent='Step '+i+' / '+steps.length;
    if(i>=steps.length){next.disabled=true;next.textContent='Done ✓';}
  }
  next.onclick=add;
  reset.onclick=()=>{i=0;thread.innerHTML='';note.textContent='Press “Next message” to begin building the conversation.';next.disabled=false;next.textContent='Next message ▸';stepEl.textContent='Step 0 / 5';};
</script>
</body>
</html>
